name: Deploy to GitHub Pages

# web/ 만 게시한다. 저장소 루트에는 분석 스크립트와 문서가 있어
# 루트나 /docs 를 그대로 쓰는 방식(Pages 기본 옵션)은 맞지 않는다.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 배포를 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 배포 산출물 점검
        run: |
          set -e
          for f in index.html app.js score.js style.css \
                   data/parcels.pmtiles data/scoring.json \
                   data/meta.json data/stations.geojson data/boundary.geojson; do
            test -s "web/$f" || { echo "::error::web/$f 누락 또는 빈 파일"; exit 1; }
          done
          echo "PMTiles $(du -h web/data/parcels.pmtiles | cut -f1)"
          # 점수를 미리 구워 넣지 않았는지 확인 (D-003)
          if grep -q '"rank"' web/data/meta.json; then
            echo "::error::meta.json 에 순위가 포함됐다"; exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
