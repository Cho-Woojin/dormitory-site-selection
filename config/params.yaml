# 임대형기숙사 적합 필지 탐색 — 파라미터
#
# 값의 근거 표기:
#   [조례]  법령·조례 원문 확인됨
#   [시세]  실제 시장 데이터로 확인됨
#   [가정]  검증 안 된 추정치 — 결과 해석 시 주의
#
# 결정 이력은 docs/DECISIONS.md 참조.

region:
  name: 성북구
  sgg_code: "11290"
  analysis_crs: "EPSG:5186"  # 토지특성정보 원본 좌표계. 거리/면적은 반드시 여기서
  output_crs: "EPSG:4326"
  station_buffer_m: 1500     # 구 경계 밖 역도 이 범위까지 수집
  # 실측: 총 52,970 필지 (AL_D194_11290_20260520, 기준일 2026-05-13)

# ---------------------------------------------------------------------------
# 용도지역별 용적률 / 건폐율 / 공동주택(기숙사) 허용
# [조례] 서울특별시 도시계획 조례 제44조(건폐율)·제48조(용적률)
#        [시행 2026.7.13.] [서울특별시조례 제10139호] 원문 대조 완료 (T-103 ✅)
# ---------------------------------------------------------------------------
zoning:
  # [조례] 2025-05-19 ~ 2028-05-18 소규모 건축물 용적률 한시 완화 (D-005)
  relaxation_2025:
    enabled: true
    valid_from: "2025-05-19"
    valid_until: "2028-05-18"

  zones:
    제1종전용주거지역:   { far: 100,  far_relaxed: null, bcr: 50, housing_ok: false }
    제2종전용주거지역:   { far: 120,  far_relaxed: null, bcr: 40, housing_ok: true  }
    제1종일반주거지역:   { far: 150,  far_relaxed: null, bcr: 60, housing_ok: true  }
    제2종일반주거지역:   { far: 200,  far_relaxed: 250,  bcr: 60, housing_ok: true  }
    제3종일반주거지역:   { far: 250,  far_relaxed: 300,  bcr: 50, housing_ok: true  }
    준주거지역:          { far: 400,  far_relaxed: null, bcr: 60, housing_ok: true  }
    근린상업지역:        { far: 600,  far_relaxed: null, bcr: 60, housing_ok: true  }
    일반상업지역:        { far: 800,  far_relaxed: null, bcr: 60, housing_ok: true  }
    중심상업지역:        { far: 1000, far_relaxed: null, bcr: 60, housing_ok: true  }
    유통상업지역:        { far: 600,  far_relaxed: null, bcr: 60, housing_ok: true  }
    준공업지역:          { far: 400,  far_relaxed: null, bcr: 60, housing_ok: true  }
    전용공업지역:        { far: 200,  far_relaxed: null, bcr: 60, housing_ok: false }
    일반공업지역:        { far: 200,  far_relaxed: null, bcr: 60, housing_ok: false }
    자연녹지지역:        { far: 50,   far_relaxed: null, bcr: 20, housing_ok: false }
    생산녹지지역:        { far: 50,   far_relaxed: null, bcr: 20, housing_ok: false }
    보전녹지지역:        { far: 50,   far_relaxed: null, bcr: 20, housing_ok: false }
    개발제한구역:        { far: 0,    far_relaxed: null, bcr: 0,  housing_ok: false }

# ---------------------------------------------------------------------------
# 하드 필터 (METHODOLOGY §1) — 실측 퍼널: 52,970 → 5,238 필지 (9.9%)
# ---------------------------------------------------------------------------
filters:
  min_rooms: 20                    # [법령] 건축법 시행령 별표1 2호 라목

  # F6 지목 — 토지특성정보 A11
  allowed_jimok: [대]              # 52,970 → 40,602

  # F3 토지이용상황 — 토지특성정보 A18
  # 아파트단지·연립 부지는 통째로 매입 불가, 공원/도로는 건축 불가
  excluded_landuse: [아파트, 연립, 공원등, 도로등]

  # F4 접도 — 토지특성정보 A24
  # "(불)" = 자동차 통행 불가. 임대형기숙사 신축 사실상 불가능하므로 제외.
  excluded_road_access: [맹지, 세로한면(불), 세로각지(불)]     # -8,021 필지
  # 주의: '지정되지않음'(지목 '대' 중 2,569필지)은 현재 통과시킨다.
  #       판정 불가일 뿐 맹지라는 뜻은 아니다. 웹에서 별도 플래그로 표시할 것.

# ---------------------------------------------------------------------------
# S1 · 사업성  (D-007)
# 분모 = 총사업비 − 보증금총액 (보증금은 무이자 조달자금이므로 순투자금을 줄인다)
# 실측 결과: 중위 4.1% (5~95%: 3.0~5.4%) — 개발사업 통상 기대치 범위
# ---------------------------------------------------------------------------
profitability:
  denominator: net_equity          # net_equity | total_cost | land_cost

  land_price_multiplier: 1.5       # [가정] 공시지가→실거래가. 통상 1.4~1.7 (Q-02 확정)
  unit_construction_cost: 2_500_000  # [가정] 원/㎡ 연면적 기준
  soft_cost_ratio: 0.20            # [가정] 설계·감리·금융 등 부대비

  net_area_ratio: 0.65             # [가정] 전용률 (연면적 → 실면적)
  room_area_sqm: 16.0              # [가정] 1실 면적
  monthly_rent_per_room: 660_000   # [시세] 2026년 고려대 인근 원룸 평균 66.3만원 (전년비 +9.8%)
  deposit_per_room: 10_000_000     # [시세] 실당 보증금 1,000만원
  vacancy_rate: 0.05               # [가정]
  opex_ratio: 0.25                 # [가정]

  # 실현계수 = base × 형상계수 × 경사계수  (D-006)
  # 형상/경사는 토지특성정보 A22/A20 실측값. base만 가정치.
  realization:
    base: 0.90                     # [가정] 사선제한·주차 등 공통 감가
    shape_factor:                  # A22 필지형상
      정방형:   1.00
      가로장방: 0.98
      세로장방: 0.95
      사다리형: 0.92
      부정형:   0.85
      자루형:   0.75
      지정되지않음: 0.90           # 결측 대체값
    slope_factor:                  # A20 경사
      평지:     1.00
      저지:     0.97
      완경사:   0.95
      급경사:   0.85
      고지:     0.85
      지정되지않음: 0.95

# ---------------------------------------------------------------------------
# S2 · 일조환경
# ---------------------------------------------------------------------------
# 건물 데이터: AL_D010 성북구 40,368동 (기준일 2026-08-09), 높이 A16 / 층수 A26
solar:
  latitude: 37.59
  winter_solstice_altitude: 28.97  # 90 − 37.59 − 23.44 (동지 정오 태양고도)
  search_radius_m: 50
  sector_start_deg: 135            # 남동
  sector_end_deg: 225              # 남서
  sector_step_deg: 15
  # [실측] 성북구 건물 13,658동의 높이/층수 중위 3.25m (IQR 2.94~3.75)
  default_floor_height_m: 3.25     # 높이 결측·층수 있음 → 층수 × 이 값
  # 높이·층수 둘 다 없는 건물 10,009동(24.8%)의 처리 — Q-09 미결
  #   assumed_floors: 층수도 없을 때 가정할 층수. 빼면 일조가 낙관적으로 부풀려진다.
  unknown_building_floors: 2       # [잠정] 유효 건물의 중위 층수와 동일
  drop_unknown_buildings: false    # true 로 두면 안 된다 (낙관 편향)
  road_bonus: 0.25                 # 남측 접도 시 최대 가산율
  road_bonus_full_width_m: 12.0
  assume_future_buildout: true     # 인접 나대지에 상한 건물 가정 (보수적)

# ---------------------------------------------------------------------------
# S3 · 역세권 등급 (계단식) — 최하위 정렬 기준
# ---------------------------------------------------------------------------
transit:
  distance_metric: euclidean       # euclidean | walking (2단계에서 osmnx)
  grades: { A: 250, B: 500, C: 750, D: 1000 }   # 초과는 E
  include_under_construction: false
  # [사실] 동북선 경전철 2027년 11월 개통 예정, 성북구 통과, 고려대역에서 6호선 환승.
  #        역명은 2026년 말 서울시 지명위원회 확정 예정 — 현재 좌표는 잠정. (D-009)

# ---------------------------------------------------------------------------
# 계층 정렬 (METHODOLOGY §0) — 웹의 핵심 슬라이더
# 3순위까지만 사용. 동급 내 최종 타이브레이크는 S1 원값. (D-008)
# ---------------------------------------------------------------------------
ranking:
  tol_profitability_pct: 5    # 실측: 상위 200 중 149개가 순수 사업성 순위 유지
  tol_solar_pct: 10

tiles:
  min_zoom: 11
  max_zoom: 17
  output: web/data/parcels.pmtiles
  max_size_mb: 50
